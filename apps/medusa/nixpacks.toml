# Run with the repository root as build context. Docker is the primary build path.

[phases.setup]
nixPkgs = ["bash", "curl", "xz"]
paths = ["/opt/node/bin"]
cmds = [
  "sh scripts/install-node-runtime.sh",
  "node --version",
  "yarn --version"
]

[phases.install]
cmds = ["yarn install --immutable"]

[phases.build]
cmds = ["bash -c 'cd apps/medusa && yarn build:standalone'"]

[start]
cmd = "bash -c 'cd apps/medusa && yarn predeploy && yarn start:standalone'"
