pid /tmp/nginx.pid;
worker_processes 1;
events { worker_connections 256; }
http {
  # Cloudflare (or the legacy Hetzner proxy) terminates public HTTPS.
  map $http_x_forwarded_proto $preview_scheme {
    default $scheme;
    https https;
  }
  access_log /dev/stdout;
  error_log /dev/stderr warn;
  client_max_body_size 20m;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $preview_scheme;
  add_header X-Robots-Tag 'noindex, nofollow, noarchive' always;
  server {
    listen 9000;
    location / { proxy_pass http://medusa:9000; }
  }
  server {
    listen 3000;
    location / { proxy_pass http://storefront:3000; }
  }
}

# TLS passthrough: the SDK retains api.openai.com certificate verification.
# No plaintext API key here, no arbitrary CONNECT target, no published host port.
stream {
  resolver 1.1.1.1 1.0.0.1 valid=60s ipv6=off;
  map $ssl_preread_server_name $preview_ai_upstream {
    default "";
    api.openai.com api.openai.com:443;
  }
  server {
    listen 443;
    ssl_preread on;
    proxy_connect_timeout 10s;
    proxy_timeout 30s;
    proxy_pass $preview_ai_upstream;
  }
}
