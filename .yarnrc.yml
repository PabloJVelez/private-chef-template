nodeLinker: node-modules

yarnPath: .yarn/releases/yarn-4.5.0.cjs

# The bounded reviews patch uses framework exports. Its legacy direct peers are unused.
packageExtensions:
  "@lambdacurry/medusa-product-reviews@1.4.0":
    peerDependenciesMeta:
      "@mikro-orm/cli":
        optional: true
      "@mikro-orm/core":
        optional: true
      "@mikro-orm/knex":
        optional: true
      "@mikro-orm/migrations":
        optional: true
      "@mikro-orm/postgresql":
        optional: true
      "awilix":
        optional: true
      "pg":
        optional: true
  # These packages consume utils' Express peer without forwarding it. A second
  # utils instance splits the DML entity cache and breaks native module boot.
  "@medusajs/modules-sdk@2.22.6":
    dependencies:
      express: "^4.21.0"
      "@types/express": "^4.17.21"
  "@medusajs/workflows-sdk@2.22.6":
    dependencies:
      express: "^4.21.0"
      "@types/express": "^4.17.21"
  "@medusajs/orchestration@2.22.6":
    dependencies:
      express: "^4.21.0"
      "@types/express": "^4.17.21"
  "@medusajs/query@2.22.6":
    dependencies:
      express: "^4.21.0"
      "@types/express": "^4.17.21"
  "@medusajs/framework@2.22.6":
    dependencies:
      zod: "4.6.6"
