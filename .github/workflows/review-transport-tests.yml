name: Review transport tests

on:
  pull_request:
    paths:
      - '.github/review/**'
      - '.github/workflows/auto-pr-review.yml'
      - '.github/workflows/review-transport-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Offline boundary and regression tests
        run: python3 -m unittest discover -s .github/review -p 'test_*.py' -v
