name: Automatic PR review

on:
  # Only trusted default-branch code runs. PR objects are read as data, never checked out.
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: string
      dry_run:
        description: Generate an artifact without publishing a review
        default: true
        type: boolean

permissions: {}

concurrency:
  group: auto-pr-review-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  review:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: pr-review
      deployment: false
    permissions:
      contents: read
      pull-requests: read
      checks: read
      statuses: read
    outputs:
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: .github/review
      - name: Snapshot exact PR revisions as data
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: python3 -I .github/review/review.py prepare --directory "$RUNNER_TEMP/review"
      - name: Generate review (no tools or GitHub credential)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REVIEW_MODEL: ${{ vars.PR_REVIEW_MODEL || 'gpt-5.4-mini-2026-03-17' }}
        run: python3 -I .github/review/review.py generate --directory "$RUNNER_TEMP/review"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: artifact
        with:
          name: pr-review-result
          path: ${{ runner.temp }}/review/result.json
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: review
    if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # Trusted helper checkout only.
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: .github/review
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.review.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/review
      - name: Check freshness and publish COMMENT
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: python3 -I .github/review/review.py publish --directory "$RUNNER_TEMP/review"
